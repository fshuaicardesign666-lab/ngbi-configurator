<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NGBI · Bespoke Configurator 保时捷定制</title>
<style>
  :root{
    --bg:#071A17; --bg2:#0B211C; --card:#102D26; --card2:#15372E;
    --line:rgba(211,186,240,.2); --ink:#D6B8F5; --ink-strong:#C59AEF; --white:#F2EDF7; --muted:#A9A3B1;
    --accent:#C59AEF; --accent2:#D6B8F5; --purple:#C59AEF; --gold:#BBA66F;
    --shadow:0 24px 70px rgba(0,0,0,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
  body{font-family:"Inter","Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;font-weight:300;letter-spacing:.025em;color:var(--ink);user-select:none;-webkit-user-select:none;
    background-image:radial-gradient(ellipse at 75% 3%, rgba(65,104,82,.18), transparent 37%), linear-gradient(145deg,#071A17,#0A211B 58%,#081914)!important;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(900px 560px at 88% 108%, rgba(139,107,181,.14), transparent 60%);}
  #stage{position:fixed;inset:0;cursor:grab;}
  #stage:active{cursor:grabbing;}
  canvas{display:block;}

  .top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;pointer-events:none;background:linear-gradient(rgba(7,26,23,.7),transparent);}
  .brand{display:flex;align-items:center;gap:10px;}
  .enso{width:24px;height:24px;border:1.5px solid var(--ink);border-radius:50%;flex:0 0 auto;background:linear-gradient(140deg,#D6B8F5,#8C6AB1);box-shadow:0 0 28px rgba(197,154,239,.25);}
  .brand .t{font-size:13px;font-weight:400;letter-spacing:.3em;color:var(--ink-strong);}
  .brand .t span{color:var(--ink);}
  .brand .sub{font-size:8px;letter-spacing:.2em;color:var(--muted);margin-top:3px;text-transform:uppercase;}
  .top .hint{font-size:9.5px;color:var(--muted);letter-spacing:.05em;}

  /* 左侧 checklist */
  .side{position:fixed;left:0;top:0;bottom:0;width:264px;z-index:10;background:rgba(7,26,23,.91);backdrop-filter:blur(20px);border-right:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .3s cubic-bezier(.22,.61,.36,1);}
  .side.open{transform:translateX(0);}
  .side-head{padding:16px 16px 10px;border-bottom:1px solid var(--line);}
  .side-head .t{font-size:11px;letter-spacing:.26em;color:var(--ink-strong);font-weight:400;}
  .side-head .s{font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:.06em;}
  .scroll{flex:1;overflow-y:auto;padding:10px 12px 40px;}
  .cat{margin-bottom:8px;}
  .cat-t{font-size:10px;letter-spacing:.14em;color:var(--muted);padding:12px 4px 6px;display:flex;align-items:center;gap:6px;}
  .cat-t .ic{font-size:13px;}
  .item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:11px;cursor:pointer;transition:background .15s;border:1px solid transparent;}
  .item:hover{background:rgba(255,255,255,.05);}
  .item.on{background:rgba(197,154,239,.13);border-color:rgba(197,154,239,.3);}
  .item .l{font-size:12px;letter-spacing:.03em;}
  .item .l .en{display:block;font-size:8px;color:var(--muted);letter-spacing:.08em;margin-top:1px;text-transform:uppercase;}
  .item .v{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);}
  .item .v .dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.25);flex:0 0 auto;}
  .item .ck{width:17px;height:17px;border:1px solid var(--line);border-radius:5px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;margin-right:9px;transition:all .15s;}
  .item .ck.on{background:var(--ink-strong);border-color:var(--ink-strong);box-shadow:0 0 12px rgba(197,154,239,.35);color:#10231D;}

  /* 底部色板 */
  .dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;gap:9px;align-items:center;max-width:94vw;}
  .dock-t{font-size:11px;letter-spacing:.16em;color:var(--ink-strong);font-weight:400;}
  .dock-t .en{color:var(--muted);font-size:9px;}
  .tray{display:flex;gap:11px;padding:14px 18px;background:rgba(7,26,23,.72);backdrop-filter:blur(22px) saturate(1.2);border:1px solid var(--line);border-radius:24px;max-width:94vw;overflow-x:auto;box-shadow:0 18px 50px rgba(0,0,0,.35);}
  .swatch{width:54px;height:54px;border-radius:50%;border:1px solid rgba(211,186,240,.25);cursor:pointer;transition:all .25s cubic-bezier(.22,.61,.36,1);position:relative;flex:0 0 auto;
    box-shadow:inset -6px -7px 12px rgba(0,0,0,.55), inset 3px 3px 6px rgba(255,255,255,.28), 0 6px 16px rgba(0,0,0,.5);}
  .swatch:hover{transform:translateY(-4px) scale(1.06);}
  .swatch.on{border-color:#BBA66F;box-shadow:0 0 0 2px #BBA66F, inset -6px -7px 12px rgba(0,0,0,.55), inset 3px 3px 6px rgba(255,255,255,.28);}
  .swatch .nm{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);white-space:nowrap;margin-top:7px;opacity:0;transition:opacity .2s;pointer-events:none;letter-spacing:.04em;}
  .swatch:hover .nm{opacity:1;}

  /* 按钮 */
  .menu{position:fixed;left:14px;top:58px;z-index:11;width:42px;height:42px;border-radius:12px;background:rgba(7,26,23,.85);backdrop-filter:blur(16px);border:1px solid var(--line);color:var(--ink);font-size:16px;cursor:pointer;transition:all .22s ease;}
  .menu:hover{border-color:var(--ink-strong);transform:translateY(-1px);}
  .summary{position:fixed;right:14px;top:58px;z-index:11;height:38px;padding:0 14px;border-radius:11px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);color:var(--ink);font-size:11px;cursor:pointer;letter-spacing:.06em;}
  .save{position:fixed;right:14px;top:104px;z-index:11;background:linear-gradient(130deg,#B999DF,#8E6AB6);color:#10231D;border:1px solid rgba(216,190,244,.65);border-radius:999px;padding:12px 22px;font-size:11px;font-weight:550;letter-spacing:.08em;cursor:pointer;box-shadow:0 8px 24px rgba(154,111,194,.14);transition:transform .22s ease,filter .22s ease,box-shadow .22s ease;}
  .save:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 12px 28px rgba(172,133,210,.24);}
  .back{position:fixed;left:14px;top:104px;z-index:11;background:rgba(7,26,23,.85);backdrop-filter:blur(16px);border:1px solid rgba(197,154,239,.45);color:var(--ink);border-radius:999px;padding:11px 18px;font-size:11px;font-weight:400;cursor:pointer;letter-spacing:.08em;transition:all .22s ease;}
  .back:hover{background:var(--ink-strong);color:#10231D;transform:translateY(-1px);}
  .save:hover{transform:translateY(-2px);}

  /* 配置摘要弹窗 */
  .modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(8,6,10,.65);backdrop-filter:blur(6px);}
  .modal.show{display:flex;}
  .sheet{background:#1A1622;border:1px solid var(--line);border-radius:20px;padding:24px;max-width:92vw;max-height:80vh;overflow-y:auto;position:relative;min-width:300px;}
  .sheet h3{font-size:14px;letter-spacing:.1em;margin-bottom:4px;}
  .sheet .sub{font-size:10px;color:var(--muted);margin-bottom:14px;letter-spacing:.06em;}
  .sheet .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11px;}
  .sheet .row .k{color:var(--muted);}
  .sheet .row .val{color:var(--ink);display:flex;align-items:center;gap:6px;}
  .sheet .row .val .dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(255,255,255,.25);}
  .sheet .close{position:absolute;top:14px;right:18px;font-size:18px;color:var(--muted);cursor:pointer;}

  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:40;background:#1A1622;border:1px solid var(--line);border-radius:12px;padding:11px 18px;font-size:12px;opacity:0;transition:all .3s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--bg);}
  .loading .sp{width:38px;height:38px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent2);border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:640px){ .side{width:230px;} }
@keyframes luxEnter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
  .main>*{animation:luxEnter .5s cubic-bezier(.2,.7,.2,1) both}
  .card{animation:luxEnter .5s cubic-bezier(.2,.7,.2,1) both}
  .card:nth-child(2){animation-delay:.05s}
  .card:nth-child(3){animation-delay:.1s}
  .card:nth-child(4){animation-delay:.15s}
  .card:nth-child(5){animation-delay:.2s}
</style>
</head>

</div>

    {id:'treadplate', label:'迎宾踏板', en:'Tread Plate'},
    {id:'rearseatback', label:'后排座椅背板', en:'Rear Seat Back'},
    {id:'metal', label:'金属饰件', en:'Metal Trim'},
    {id:'steering', label:'方向盘', en:'Steering Wheel'},
  ]},
  { cat:'数码', ic:'✨', items:[
    {id:'mood', label:'氛围光', en:'Mood', apply:'mood'},
    {id:'scene', label:'场景', en:'Scene', apply:'scene'},
  ]},
];

const state = {};   // { paint:0, rim:0, ... }
CHECKLIST.forEach(c=>c.items.forEach(it=>{ state[it.id]=0; }));
const included = {};  // 每个 checklist 项是否选入创作清单
CHECKLIST.forEach(c=>c.items.forEach(it=>{ included[it.id]=false; }));

// configurator id → NGBI 19 部件 id 映射
const PART_MAP = { paint:'paint', rim:'wheel', caliper:'smalldetail', lights:'headlight', glass:'smalldetail', trim:'smalldetail',
  coachline:'coachline', stripes:'hood', frontpattern:'hood', rearpattern:'trunk',
  leather:'leather', stitch:'leather', veneer:'fascia', starlight:'starlight', doorpanel:'doorpanel',
  seatback:'frontseatback', fascia:'fascia', embroidery:'embroidery', seattexture:'quilt', treadplate:'tread',
  rearseatback:'rearseatback', metal:'metal', steering:'steering' };

const NG_KEY = 'ngbi.demo.v2';
function syncToNGBI(){
  let d = {};
  try{ d = JSON.parse(localStorage.getItem(NG_KEY)) || {}; }catch(e){}
  if(!d.parts) d.parts = {};
  if(!d.workflow) d.workflow = { stage:'draft', history:[] };
  if(!d.configRevisions) d.configRevisions = [];
  if(!d.quote) d.quote = { status:'none', rough:null, ready:null, internal:{} };
  CHECKLIST.forEach(cat=>cat.items.forEach(it=>{
    const pid = PART_MAP[it.id]; if(!pid) return;
    const opt = PALETTES[it.id][state[it.id]];
    d.parts[pid] = {
      included: !!included[it.id],
      material: opt.name, color: opt.color, shape: it.label, process: '', note: ''
    };
  }));
  localStorage.setItem(NG_KEY, JSON.stringify(d));
}
function loadFromNGBI(){
  try{
    const d = JSON.parse(localStorage.getItem(NG_KEY));
    if(!d || !d.parts) return;
    const rev = d.parts;
    CHECKLIST.forEach(cat=>cat.items.forEach(it=>{
      const pid = PART_MAP[it.id]; if(!pid || !rev[pid]) return;
      if(rev[pid].included) included[it.id] = true;
    }));
  }catch(e){}
}
loadFromNGBI();

/* ==================== 渲染器 ==================== */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0A0A0F);
try{ const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.06).texture; }catch(e){}

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(6, 2.4, 8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0); controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 3; controls.maxDistance = 20; controls.maxPolarAngle = Math.PI*0.55;
controls.autoRotate = true; controls.autoRotateSpeed = 0.7; controls.update();

scene.add(new THREE.HemisphereLight(0xdfe4ff, 0x14101a, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(6,9,6);
key.castShadow = true; key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-10; key.shadow.camera.right=10; key.shadow.camera.top=10; key.shadow.camera.bottom=-10;
scene.add(key);
scene.add(new THREE.DirectionalLight(0x8899ff,1.5).position.set(-5,2,-4));
scene.add(new THREE.DirectionalLight(0xffd9a8,0.7).position.set(-3,1,5));
const moodLight = new THREE.PointLight(0x9fb8ff, 0, 12); moodLight.position.set(0,2,0); scene.add(moodLight);

const floor = new THREE.Mesh(new THREE.CircleGeometry(16,96), new THREE.MeshStandardMaterial({color:0x0d0b10, roughness:0.25, metalness:0.6}));
floor.rotation.x = -Math.PI/2; floor.position.y = -0.01; floor.receiveShadow = true; scene.add(floor);

/* ==================== 模型 + 材质映射 ==================== */
const carRoot = new THREE.Group(); scene.add(carRoot);
const MAT = { paint:[], rim:[], caliper:[], lights:[], glass:[], plastic:[], black:[] };
const overlays = { coachline:[], stripes:[], front:null, rear:null };

const loader = new GLTFLoader();
loader.load('https://raw.githubusercontent.com/Bhavydeveloper77/BhavyDave_Porsche/master/public/Porsche911.glb', (gltf)=>{
  const model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const s = 5.0 / Math.max(size.x,size.y,size.z);
  model.scale.setScalar(s);
  model.position.x -= center.x*s; model.position.z -= center.z*s; model.position.y -= box.min.y*s;

  model.traverse((o)=>{
    if(o.isMesh){
      o.castShadow = true; o.receiveShadow = true;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m=>{
        const n = (m.name||'').toLowerCase();
        if(n==='paint'||n==='coat') MAT.paint.push(m);
        else if(n==='silver') MAT.rim.push(m);
        else if(n==='material.001') MAT.caliper.push(m);
        else if(n==='lights') MAT.lights.push(m);
        else if(n==='window'||n==='glass') MAT.glass.push(m);
        else if(n==='plastic') MAT.plastic.push(m);
        else if(n==='full_black'||n==='material') MAT.black.push(m);
      });
    }
  });
  carRoot.add(model);
  createOverlays(model);
  refreshAll();
  document.getElementById('loading').style.display = 'none';
  console.log('材质映射:', Object.fromEntries(Object.entries(MAT).map(([k,v])=>[k,v.length])));
}, (e)=>{ 
  if(e.total){ const pct = Math.round(e.loaded/e.total*100); const el=document.getElementById('loadPct'); if(el) el.textContent = '加载中 '+pct+'%'; }
}, ()=>{ document.getElementById('loading').innerHTML = '<span style="color:var(--muted)">模型加载失败，请刷新重试（网络较慢，请稍候）</span>'; });

/* ==================== 应用函数 ==================== */
function setColor(mats, hex, metalness, roughness){
  mats.forEach(m=>{ if(hex!==null){ m.color.setHex(hex); } m.metalness=metalness; m.roughness=roughness; });
}
const APPLY = {
  paint(){ setColor(MAT.paint, PALETTES.paint[state.paint].color, 0.4, 0.42); },
  rim(){ setColor(MAT.rim, PALETTES.rim[state.rim].color, 0.85, 0.3); },
  caliper(){ setColor(MAT.caliper, PALETTES.caliper[state.caliper].color, 0.5, 0.35); },
  lights(){ setColor(MAT.lights, PALETTES.lights[state.lights].color, 0.1, 0.4); },
  glass(){ setColor(MAT.glass, PALETTES.glass[state.glass].color, 0.1, 0.1); },
  trim(){
    const c = PALETTES.trim[state.trim];
    setColor(MAT.plastic, c.color===null ? PALETTES.paint[state.paint].color : c.color, 0.3, 0.5);
  },
  mood(){
    const m = PALETTES.mood[state.mood];
    moodLight.color.setHex(m.color); moodLight.intensity = 3.0; scene.background.setHex(m.bg);
  },
  scene(){
    const m = PALETTES.scene[state.scene];
    // 场景只改背景色（氛围光已独立）；若 mood 也用背景，则 scene 优先
    scene.background.setHex(m.bg);
  },
  coachline(){
    const c = PALETTES.coachline[state.coachline];
    overlays.coachline.forEach(m=>{ m.visible = c.color!==null; if(c.color!==null) m.material.color.setHex(c.color); });
  },
  stripes(){
    const c = PALETTES.stripes[state.stripes];
    overlays.stripes.forEach(m=>{ m.visible = c.color!==null; if(c.color!==null) m.material.color.setHex(c.color); });
  },
  frontpattern(){ applyPattern(overlays.front, PALETTES.frontpattern[state.frontpattern]); },
  rearpattern(){ applyPattern(overlays.rear, PALETTES.rearpattern[state.rearpattern]); },
};
function refreshAll(){ Object.values(APPLY).forEach(f=>f()); }

/* ==================== 图形纹样叠加 ==================== */
function createOverlays(model){
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const L = size.x, W = size.z;
  const cy = box.min.y + size.y*0.55;

  // coachline 左右两条细线
  for(const side of [-1,1]){
    const cl = new THREE.Mesh(
      new THREE.BoxGeometry(L*0.96, 0.015, 0.015),
      new THREE.MeshStandardMaterial({ color:0xc8a96e, metalness:0.8, roughness:0.3 })
    );
    cl.position.set(0, cy, side*(W/2 + 0.012));
    cl.visible = false;
    overlays.coachline.push(cl); carRoot.add(cl);
  }
  // racing stripes 两条纵向条纹
  for(const off of [-0.35, 0.35]){
    const st = new THREE.Mesh(
      new THREE.PlaneGeometry(L*0.9, 0.22),
      new THREE.MeshStandardMaterial({ color:0xffffff, metalness:0.3, roughness:0.5 })
    );
    st.rotation.x = -Math.PI/2;
    st.position.set(0, box.max.y + 0.008, off);
    st.visible = false;
    overlays.stripes.push(st); carRoot.add(st);
  }
  overlays.front = makeDecal(box, L*0.28);
  overlays.rear = makeDecal(box, -L*0.28);
}
function makeDecal(box, xOff){
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 4;
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(0.62, 0.62),
    new THREE.MeshStandardMaterial({ map:tex, transparent:true, metalness:0.4, roughness:0.35 })
  );
  mesh.rotation.x = -Math.PI/2;
  mesh.position.set(xOff, box.max.y + 0.01, 0);
  mesh.visible = false;
  carRoot.add(mesh);
  return mesh;
}
function applyPattern(mesh, opt){
  if(!mesh) return;
  if(opt.color===null){ mesh.visible = false; return; }
  mesh.visible = true;
  drawPattern(mesh.material.map.image, opt.name);
  mesh.material.map.needsUpdate = true;
}
function drawPattern(canvas, name){
  const c = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  c.clearRect(0,0,w,h);
  const gold = '#c8a96e', light = '#e8e0cc';
  c.lineWidth = 14; c.strokeStyle = gold; c.fillStyle = gold;
  if(name==='盾徽'){
    c.beginPath();
    c.moveTo(w/2, h*0.1);
    c.lineTo(w*0.82, h*0.22); c.lineTo(w*0.82, h*0.55);
    c.quadraticCurveTo(w*0.82, h*0.78, w/2, h*0.9);
    c.quadraticCurveTo(w*0.18, h*0.78, w*0.18, h*0.55);
    c.lineTo(w*0.18, h*0.22); c.closePath();
    c.stroke();
    c.font = 'bold 120px serif'; c.textAlign='center'; c.textBaseline='middle';
    c.fillStyle = gold; c.fillText('N', w/2, h*0.5);
  } else if(name==='几何纹'){
    for(let i=0;i<3;i++){
      const r = h*0.3 - i*h*0.07;
      c.beginPath();
      c.moveTo(w/2, h/2 - r); c.lineTo(w/2 + r, h/2); c.lineTo(w/2, h/2 + r); c.lineTo(w/2 - r, h/2);
      c.closePath(); c.stroke();
    }
  } else if(name==='赛道格'){
    const n=4, s=w/n;
    for(let i=0;i<n;i++) for(let j=0;j<n;j++){
      if((i+j)%2===0){ c.fillStyle=gold; c.fillRect(i*s,j*s,s,s); }
    }
  } else if(name==='型号字样'){
    c.font = 'bold 130px sans-serif'; c.textAlign='center'; c.textBaseline='middle';
    c.fillStyle = light; c.fillText('911', w/2, h/2);
  }
}

/* ==================== UI 渲染 ==================== */
const checklistEl = document.getElementById('checklist');
CHECKLIST.forEach(cat=>{
  const ct = document.createElement('div'); ct.className='cat';
  ct.innerHTML = `<div class="cat-t"><span class="ic">${cat.ic}</span>${cat.cat}</div>`;
  cat.items.forEach(it=>{
    const d = document.createElement('div'); d.className='item'; d.dataset.id = it.id;
    d.innerHTML = `<div class="ck ${included[it.id]?'on':''}">${included[it.id]?'✓':''}</div><div class="l">${it.label}<span class="en">${it.en}</span></div><div class="v"><span class="val-txt"></span><span class="dot" style="background:transparent"></span></div>`;
    d.querySelector('.ck').onclick = (e)=>{ e.stopPropagation(); included[it.id]=!included[it.id]; d.querySelector('.ck').classList.toggle('on', included[it.id]); d.querySelector('.ck').textContent = included[it.id]?'✓':''; syncToNGBI(); };
    d.onclick = ()=> selectItem(it.id);
    ct.appendChild(d);
  });
  checklistEl.appendChild(ct);
});

let currentId = 'paint';
function selectItem(id){
  currentId = id;
  document.querySelectorAll('.item').forEach(el=>el.classList.toggle('on', el.dataset.id===id));
  renderTray(id);
  renderDockTitle(id);
}
function findItem(id){ for(const c of CHECKLIST) for(const it of c.items) if(it.id===id) return it; }

function renderDockTitle(id){
  const it = findItem(id);
  document.getElementById('dockTitle').innerHTML = `${it.label} <span class="en">${it.en}</span>`;
}
function ballGradient(hex){
  const c = new THREE.Color(hex);
  const light = c.clone().lerp(new THREE.Color(0xffffff), 0.55).getStyle();
  const mid = c.getStyle();
  const dark = c.clone().lerp(new THREE.Color(0x000000), 0.6).getStyle();
  // 明显的高光斑 + 车漆渐变 + 底部反光，模拟金属/珠光材质球
  return `radial-gradient(circle at 30% 26%, rgba(255,255,255,.95), rgba(255,255,255,0) 26%), radial-gradient(circle at 68% 74%, rgba(255,255,255,.18), rgba(255,255,255,0) 40%), radial-gradient(circle at 32% 30%, ${light}, ${mid} 52%, ${dark} 88%)`;
}
function renderTray(id){
  const tray = document.getElementById('tray'); tray.innerHTML='';
  PALETTES[id].forEach((o,i)=>{
    const d = document.createElement('div');
    d.className = 'swatch' + (i===state[id]?' on':'');
    const bg = o.color===null ? 'radial-gradient(circle at 35% 30%, #777, #444 60%, #222)' : ballGradient(o.color);
    d.style.background = bg;
    d.innerHTML = `<span class="nm">${o.name}</span>`;
    d.onclick = ()=>{
      state[id]=i;
      document.querySelectorAll('#tray .swatch').forEach((s,j)=>s.classList.toggle('on',j===i));
      updateChecklist();
      const it = findItem(id);
      if(it.apply) APPLY[it.apply]();
      // trim 的"车身同色"需要跟随车漆
      if(id==='paint' && state.trim>0 && PALETTES.trim[state.trim].color===null) APPLY.trim();
      syncToNGBI();
      toast(o.name);
    };
    tray.appendChild(d);
  });
}
function updateChecklist(){
  document.querySelectorAll('.item').forEach(el=>{
    const id = el.dataset.id; const o = PALETTES[id][state[id]];
    const dot = el.querySelector('.dot'); const vt = el.querySelector('.val-txt');
    dot.style.background = o.color===null ? 'radial-gradient(circle at 35% 30%, #777, #444 60%, #222)' : ballGradient(o.color);
    vt.textContent = o.name;
  });
}

/* ==================== 摘要 ==================== */
function showSummary(){
  const rows = document.getElementById('summaryRows'); rows.innerHTML='';
  CHECKLIST.forEach(cat=>{
    rows.insertAdjacentHTML('beforeend', `<div class="row" style="margin-top:6px;font-weight:600;color:var(--accent2)">${cat.cat}</div>`);
    cat.items.forEach(it=>{
      const o = PALETTES[it.id][state[it.id]];
      const dot = o.color===null ? '' : `<span class="dot" style="background:#${o.color.toString(16).padStart(6,'0')}"></span>`;
      rows.insertAdjacentHTML('beforeend', `<div class="row"><span class="k">${it.label}</span><span class="val">${o.name}${dot}</span></div>`);
    });
  });
  document.getElementById('summaryModal').classList.add('show');
}

/* ==================== 事件 ==================== */
document.getElementById('menuBtn').onclick = ()=> document.getElementById('side').classList.toggle('open');
document.getElementById('summaryBtn').onclick = showSummary;
document.getElementById('summaryClose').onclick = ()=> document.getElementById('summaryModal').classList.remove('show');
document.getElementById('summaryModal').onclick = (e)=>{ if(e.target.id==='summaryModal') e.target.classList.remove('show'); };

document.getElementById('saveBtn').onclick = ()=> generateCard();

function generateCard(){
  const paintColor = PALETTES.paint[state.paint];
  const hex = paintColor.color ? '#'+paintColor.color.toString(16).padStart(6,'0') : '#666';
  let rows = '';
  CHECKLIST.forEach(cat=>{
    rows += `<div class="grp"><div class="gt">${cat.cat}</div>`;
    cat.items.forEach(it=>{
      const o = PALETTES[it.id][state[it.id]];
      const dot = o.color===null ? 'radial-gradient(circle at 35% 30%, #777, #444 60%, #222)' : ballGradient(o.color);
      rows += `<div class="r"><span class="k">${it.label}</span><span class="v"><i style="background:${dot}"></i>${o.name}</span></div>`;
    });
    rows += '</div>';
  });
  const html = `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NGBI · 定制配置卡</title><style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0A0A0F;color:#F2EFF7;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;padding:32px 20px;display:flex;justify-content:center}
    .card{width:100%;max-width:520px;background:linear-gradient(160deg,#1A1622,#14101a);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:34px 30px;position:relative;overflow:hidden}
    .card::before{content:"";position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 30%,${hex},${hex}00);opacity:.5}
    .brand{display:flex;align-items:center;gap:11px;margin-bottom:6px}
    .enso{width:30px;height:30px;border:2px solid #B99BE0;border-radius:50%}
    .brand .t{font-size:16px;font-weight:700;letter-spacing:.18em}.brand .t span{color:#B99BE0}
    .brand .sub{font-size:8px;letter-spacing:.14em;color:#8A8494;margin-top:2px}
    .head{margin:22px 0 6px;font-size:11px;letter-spacing:.2em;color:#BBA66F}
    .car{font-size:20px;font-weight:700;letter-spacing:.08em}
    .spec{margin-top:22px}
    .grp{margin-bottom:16px}
    .gt{font-size:10px;letter-spacing:.16em;color:#B99BE0;font-weight:700;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,.07)}
    .r{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12px}
    .r .k{color:#8A8494}
    .r .v{display:flex;align-items:center;gap:7px;color:#F2EFF7}
    .r .v i{width:15px;height:15px;border-radius:50%;border:1px solid rgba(255,255,255,.25);box-shadow:inset -1px -1px 2px rgba(0,0,0,.4),inset 1px 1px 2px rgba(255,255,255,.2)}
    .foot{margin-top:24px;padding-top:16px;border-top:1px solid rgba(255,255,255,.07);font-size:9px;letter-spacing:.14em;color:#8A8494;text-align:center}
  </style></head><body><div class="card">
    <div class="brand"><div class="enso"></div><div><div class="t">NGBI <span>·</span> BESPOKE</div><div class="sub">INFRASTRUCTURE FOR INDUSTRIALIZED INDIVIDUALITY</div></div></div>
    <div class="head">定制配置卡 · SPECIFICATION</div>
    <div class="car">保时捷 911</div>
    <div class="spec">${rows}</div>
    <div class="foot">Build the capability before the market arrives.</div>
  </div></body></html>`;
  const w = window.open('', '_blank');
  w.document.write(html); w.document.close();
  toast('配置卡已生成');
}

function toast(msg){
  const t = document.getElementById('toast'); t.textContent = '✦ '+msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('show'), 1300);
}

/* ==================== 初始化 ==================== */
selectItem('paint');
updateChecklist();
window.__cfg = { scene, camera, carRoot, MAT, state, PALETTES };

function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
animate();
addEventListener('resize', ()=>{ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
