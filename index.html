<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NGBI · Configurator 保时捷定制器</title>
<style>
  :root{
    --bg:#0A0A0F; --panel:rgba(20,18,26,.85); --line:rgba(255,255,255,.1);
    --ink:#F2EFF7; --muted:#8A8494; --accent:#6B3FA0; --accent2:#B99BE0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
  body{font-family:"Noto Sans SC","Microsoft YaHei",-apple-system,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;}

  #stage{position:fixed;inset:0;cursor:grab;}
  #stage:active{cursor:grabbing;}
  canvas{display:block;}

  .top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;pointer-events:none;}
  .brand{display:flex;align-items:center;gap:11px;}
  .enso{width:26px;height:26px;border:2px solid var(--accent2);border-radius:50%;flex:0 0 auto;}
  .brand .t{font-size:13px;font-weight:700;letter-spacing:.22em;}
  .brand .t span{color:var(--accent2);}
  .brand .sub{font-size:9px;letter-spacing:.16em;color:var(--muted);margin-top:2px;}
  .top .hint{font-size:10px;color:var(--muted);letter-spacing:.06em;}

  .rail{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:9px;}
  .chip{background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:13px;padding:11px 13px;cursor:pointer;text-align:center;transition:all .18s;min-width:74px;}
  .chip:hover{border-color:var(--accent2);}
  .chip.on{border-color:var(--accent2);background:rgba(107,63,160,.28);}
  .chip .ic{font-size:17px;display:block;margin-bottom:3px;}
  .chip .lb{font-size:9.5px;color:var(--muted);letter-spacing:.04em;}
  .chip.on .lb{color:var(--ink);}

  .dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;gap:10px;align-items:center;}
  .tray{display:flex;gap:8px;padding:9px 12px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;max-width:92vw;overflow-x:auto;}
  .swatch{width:38px;height:38px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .18s, border-color .18s;position:relative;flex:0 0 auto;}
  .swatch:hover{transform:translateY(-3px);}
  .swatch.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.14);}
  .swatch .nm{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--muted);white-space:nowrap;opacity:0;transition:opacity .18s;}
  .swatch:hover .nm{opacity:1;}

  .save{position:fixed;right:18px;bottom:18px;z-index:10;background:linear-gradient(135deg,#6B3FA0,#4A2A78);color:#fff;border:none;border-radius:13px;padding:12px 18px;font-size:12px;font-weight:600;letter-spacing:.08em;cursor:pointer;transition:transform .18s, box-shadow .18s;box-shadow:0 6px 24px rgba(107,63,160,.4);}
  .save:hover{transform:translateY(-2px);}

  .pop{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(8,6,10,.6);backdrop-filter:blur(6px);}
  .pop.show{display:flex;}
  .card{background:#1E1A26;border:1px solid var(--line);border-radius:20px;padding:26px;min-width:320px;max-width:90vw;position:relative;}
  .card h3{font-size:15px;letter-spacing:.06em;margin-bottom:18px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .opt{border:1px solid var(--line);border-radius:13px;padding:15px 10px;text-align:center;cursor:pointer;transition:all .18s;}
  .opt:hover{border-color:var(--accent2);}
  .opt.on{border-color:var(--accent2);background:rgba(107,63,160,.24);}
  .opt .sw{width:30px;height:30px;border-radius:50%;margin:0 auto 8px;border:2px solid rgba(255,255,255,.2);}
  .opt .lb{font-size:11px;color:var(--muted);}
  .opt.on .lb{color:var(--ink);}
  .close{position:absolute;top:16px;right:20px;font-size:20px;color:var(--muted);cursor:pointer;}

  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:30;background:#1E1A26;border:1px solid var(--line);border-radius:12px;padding:11px 18px;font-size:12px;opacity:0;transition:all .3s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .loading{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:var(--bg);}
  .loading .sp{width:36px;height:36px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent2);border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="stage"></div>
<div class="loading" id="loading"><div class="sp"></div></div>

<div class="top">
  <div class="brand">
    <div class="enso"></div>
    <div>
      <div class="t">NGBI <span>·</span> CONFIGURATOR</div>
      <div class="sub">INFRASTRUCTURE FOR INDUSTRIALIZED INDIVIDUALITY</div>
    </div>
  </div>
  <div class="hint">拖拽旋转 · 滚轮缩放 · 自动旋转中</div>
</div>

<div class="rail">
  <div class="chip on" data-chip="paint"><span class="ic">🎨</span><span class="lb">车漆</span></div>
  <div class="chip" data-chip="wheel"><span class="ic">⚙️</span><span class="lb">轮毂</span></div>
  <div class="chip" data-chip="caliper"><span class="ic">🔴</span><span class="lb">卡钳</span></div>
  <div class="chip" data-chip="mood"><span class="ic">✨</span><span class="lb">氛围</span></div>
</div>

<div class="dock">
  <div class="tray" id="swatches"></div>
</div>

<button class="save" id="saveBtn">生成配置卡 ✦</button>

<div class="pop" id="popWheel"><div class="card"><div class="close" data-close="popWheel">✕</div><h3>轮毂颜色</h3><div class="grid" id="wheelGrid"></div></div></div>
<div class="pop" id="popCaliper"><div class="card"><div class="close" data-close="popCaliper">✕</div><h3>刹车卡钳</h3><div class="grid" id="caliperGrid"></div></div></div>
<div class="pop" id="popMood"><div class="card"><div class="close" data-close="popMood">✕</div><h3>数码氛围</h3><div class="grid" id="moodGrid"></div></div></div>

<div class="toast" id="toast"></div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============ 保时捷风格色板 ============ */
const PAINTS = [
  { name:'卫红',   color:0xd5001c },
  { name:'赛车黄', color:0xf2d50f },
  { name:'GT银',   color:0xc9ccd1 },
  { name:'迈阿密蓝', color:0x00a3c4 },
  { name:'午夜蓝', color:0x0a1e3f },
  { name:'蜥蜴绿', color:0x7ac70c },
  { name:'熔岩橙', color:0xff5a00 },
  { name:'石墨灰', color:0x3a3f45 },
  { name:'香槟金', color:0xc0a878 },
  { name:'紫罗兰', color:0x5c2a7a },
  { name:'卡拉拉白', color:0xf2f2ec },
  { name:'曜石黑', color:0x0c0c0e },
];
const WHEEL_COLORS = [
  { name:'铂银', color:0xd8d8dd },
  { name:'曜黑', color:0x1a1a1e },
  { name:'钛金', color:0x9a8f7a },
  { name:'枪灰', color:0x4a4a52 },
];
const CALIPER_COLORS = [
  { name:'保时捷红', color:0xd5001c },
  { name:'荧光黄', color:0xf2d50f },
  { name:'曜黑', color:0x1a1a1e },
  { name:'钛银', color:0xc0c0c6 },
];
const MOODS = [
  { name:'极昼展厅', color:0x9fb8ff, bg:0x12182a },
  { name:'暮色落霞', color:0xff9e6d, bg:0x1a1210 },
  { name:'翡翠赛道', color:0x6fe0b0, bg:0x0e1a16 },
  { name:'紫夜霓虹', color:0xb99be0, bg:0x140f1e },
];

const state = { paint:0, wheel:0, caliper:0, mood:0 };

/* ============ 渲染器/场景 ============ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0A0A0F);

try {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.06).texture;
} catch(e) { console.warn('环境贴图不可用', e); }

const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(6, 2.5, 8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.55;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.update();

/* ============ 灯光 ============ */
scene.add(new THREE.HemisphereLight(0xdfe4ff, 0x14101a, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(6, 9, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5; key.shadow.camera.far = 50;
key.shadow.camera.left = -10; key.shadow.camera.right = 10;
key.shadow.camera.top = 10; key.shadow.camera.bottom = -10;
scene.add(key);
const rimL = new THREE.DirectionalLight(0x8899ff, 1.5);
rimL.position.set(-5, 2, -4);
scene.add(rimL);
const fill = new THREE.DirectionalLight(0xffd9a8, 0.7);
fill.position.set(-3, 1, 5);
scene.add(fill);

const moodLight = new THREE.PointLight(0x9fb8ff, 0, 12);
moodLight.position.set(0, 2, 0);
scene.add(moodLight);

/* ============ 地面 ============ */
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(16, 96),
  new THREE.MeshStandardMaterial({ color:0x0d0b10, roughness:0.25, metalness:0.6 })
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -0.01;
floor.receiveShadow = true;
scene.add(floor);

/* ============ 模型加载 ============ */
const carRoot = new THREE.Group();
scene.add(carRoot);

const paintMats = [];
const wheelMats = [];
const caliperMats = [];

const loader = new GLTFLoader();
loader.load('https://raw.githubusercontent.com/Bhavydeveloper77/BhavyDave_Porsche/master/public/Porsche911.glb', (gltf)=>{
  const model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 5.0 / maxDim;
  model.scale.setScalar(scale);
  model.position.x -= center.x * scale;
  model.position.z -= center.z * scale;
  model.position.y -= box.min.y * scale;

  model.traverse((o)=>{
    if(o.isMesh){
      o.castShadow = true;
      o.receiveShadow = true;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach((m)=>{
        const name = (m.name || '').toLowerCase();
        if(/paint|body|carbody|exterior|main|shell|coat|car_|door|hood|roof|fender|bumper|wing|trunk|boot/.test(name)){
          if(!paintMats.includes(m)) paintMats.push(m);
        } else if(name === 'silver' || /wheel|rim|hub|spoke|alloy/.test(name)){
          if(!wheelMats.includes(m)) wheelMats.push(m);
        } else if(name === 'material.001' || /caliper|brake/.test(name)){
          if(!caliperMats.includes(m)) caliperMats.push(m);
        }
      });
    }
  });

  if(paintMats.length === 0){
    let best = null, bestArea = 0;
    model.traverse((o)=>{
      if(o.isMesh){
        o.geometry.computeBoundingBox();
        const b = o.geometry.boundingBox;
        const s = new THREE.Vector3(); b.getSize(s);
        const area = s.x*s.y*s.z;
        if(area > bestArea){ bestArea = area; best = (Array.isArray(o.material)?o.material[0]:o.material); }
      }
    });
    if(best) paintMats.push(best);
  }

  carRoot.add(model);
  applyPaint(); applyWheel(); applyCaliper(); applyMood();
  document.getElementById('loading').style.display = 'none';
  console.log('模型加载完成 车漆:', paintMats.length, '轮毂:', wheelMats.length, '卡钳:', caliperMats.length);
}, (x)=>{}, (err)=>{
  console.error('模型加载失败', err);
  document.getElementById('loading').innerHTML = '<span style="color:#8A8494">模型加载失败，请刷新重试</span>';
});

function applyPaint(){
  const c = PAINTS[state.paint].color;
  paintMats.forEach(m=>{ m.color.setHex(c); m.metalness = Math.max(m.metalness, 0.35); m.roughness = Math.min(m.roughness, 0.45); });
}
function applyWheel(){
  const c = WHEEL_COLORS[state.wheel].color;
  wheelMats.forEach(m=>{ m.color.setHex(c); m.metalness = 0.9; m.roughness = 0.3; });
}
function applyCaliper(){
  const c = CALIPER_COLORS[state.caliper].color;
  caliperMats.forEach(m=>{ m.color.setHex(c); m.metalness = 0.5; m.roughness = 0.35; });
}
function applyMood(){
  const m = MOODS[state.mood];
  moodLight.color.setHex(m.color);
  moodLight.intensity = 3.0;
  scene.background.setHex(m.bg);
}

/* ============ UI ============ */
const swatchesEl = document.getElementById('swatches');
PAINTS.forEach((p,i)=>{
  const d = document.createElement('div');
  d.className = 'swatch' + (i===state.paint?' on':'');
  d.style.background = '#'+p.color.toString(16).padStart(6,'0');
  d.innerHTML = `<span class="nm">${p.name}</span>`;
  d.onclick = ()=>{ state.paint=i; applyPaint(); document.querySelectorAll('.swatch').forEach((s,j)=>s.classList.toggle('on',j===i)); toast(p.name); };
  swatchesEl.appendChild(d);
});

function fillGrid(id, list, stateKey, applyFn){
  const g = document.getElementById(id);
  list.forEach((n,i)=>{
    const o = document.createElement('div');
    o.className='opt'+(i===state[stateKey]?' on':'');
    o.innerHTML=`<div class="sw" style="background:#${n.color.toString(16).padStart(6,'0')}"></div><div class="lb">${n.name}</div>`;
    o.onclick=()=>{ state[stateKey]=i; applyFn(); document.querySelectorAll(`#${id} .opt`).forEach((e,j)=>e.classList.toggle('on',j===i)); toast(n.name); };
    g.appendChild(o);
  });
}
fillGrid('wheelGrid', WHEEL_COLORS, 'wheel', applyWheel);
fillGrid('caliperGrid', CALIPER_COLORS, 'caliper', applyCaliper);
fillGrid('moodGrid', MOODS.map(m=>({name:m.name,color:m.color})), 'mood', applyMood);

document.querySelectorAll('.chip').forEach(c=>{
  c.onclick = ()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    const map = {wheel:'popWheel', caliper:'popCaliper', mood:'popMood'};
    if(map[c.dataset.chip]) document.getElementById(map[c.dataset.chip]).classList.add('show');
  };
});
document.querySelectorAll('.close').forEach(x=>x.onclick=()=>document.getElementById(x.dataset.close).classList.remove('show'));

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = '✦ ' + msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove('show'), 1400);
}

document.getElementById('saveBtn').onclick = ()=>{
  const lines = [
    'NGBI CONFIGURATOR · 保时捷定制',
    '━━━━━━━━━━━━━━━━',
    '车漆  '+ PAINTS[state.paint].name,
    '轮毂  '+ WHEEL_COLORS[state.wheel].name,
    '卡钳  '+ CALIPER_COLORS[state.caliper].name,
    '氛围  '+ MOODS[state.mood].name,
    '━━━━━━━━━━━━━━━━',
    'Build the capability before the market arrives.',
  ];
  const blob = new Blob([lines.join('\n')], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'NGBI_保时捷配置.txt';
  a.click();
  toast('配置卡已生成');
};

/* ============ 调试暴露 + 渲染循环 ============ */
window.__cfg = { carRoot, scene, camera, paintMats, wheelMats, caliperMats };

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
